<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Plant Vision — Admin dữ liệu người dùng</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<header class="topbar">
  <div class="brand">
    <span class="logo">🌿</span>
    <div>
      <h1>Plant Vision — Admin</h1>
      <p class="sub">Dữ liệu người dùng &amp; nhận diện cây</p>
    </div>
  </div>
  <div class="topbar-right">
    <span id="syncInfo" class="sync-info">—</span>
    <button id="refreshBtn" class="btn">⟳ Tải lại</button>
  </div>
</header>

<nav class="tabs">
  <button class="tab active" data-tab="dashboard">Tổng quan</button>
  <button class="tab" data-tab="users">Người dùng</button>
  <button class="tab" data-tab="plants">Lịch sử nhận diện</button>
  <button class="tab" data-tab="chats">Trò chuyện AI</button>
</nav>

<main>
  <!-- ── Dashboard ── -->
  <section id="tab-dashboard" class="tab-panel active">
    <div class="cards" id="statCards"></div>
    <div class="grid-2">
      <div class="panel">
        <h2>Người dùng theo hoạt động</h2>
        <div id="topUsers" class="list"></div>
      </div>
      <div class="panel">
        <h2>Cây được nhận diện nhiều nhất</h2>
        <div id="topPlants" class="list"></div>
      </div>
    </div>
    <div class="panel">
      <h2>Nhật ký đồng bộ</h2>
      <div id="syncLog" class="list"></div>
    </div>
  </section>

  <!-- ── Users ── -->
  <section id="tab-users" class="tab-panel">
    <div class="toolbar">
      <input id="userSearch" type="search" placeholder="Tìm username / email / user_id…">
      <select id="userSort">
        <option value="last_seen">Hoạt động gần nhất</option>
        <option value="first_seen">Hoạt động đầu tiên</option>
        <option value="plant_count">Số cây</option>
        <option value="chat_count">Số tin nhắn</option>
        <option value="username">Username</option>
      </select>
      <button id="userSearchBtn" class="btn primary">Tìm</button>
    </div>
    <div class="panel table-wrap">
      <table>
        <thead>
          <tr>
            <th>Username</th><th>Tên hiển thị</th><th>Email</th><th>SĐT</th>
            <th>User ID</th><th>Cây</th><th>Chat</th><th>Hoạt động</th><th></th>
          </tr>
        </thead>
        <tbody id="usersBody"></tbody>
      </table>
      <div id="usersPager" class="pager"></div>
    </div>
  </section>

  <!-- ── Plants ── -->
  <section id="tab-plants" class="tab-panel">
    <div class="toolbar">
      <input id="plantSearch" type="search" placeholder="Tìm tên cây / ghi chú…">
      <label class="chk"><input type="checkbox" id="onlyLocated"> Chỉ có GPS</label>
      <button id="plantSearchBtn" class="btn primary">Tìm</button>
    </div>
    <div class="panel table-wrap">
      <table>
        <thead>
          <tr>
            <th>Ảnh</th><th>Tên cây</th><th>Tên khoa học</th><th>Độ tin cậy</th>
            <th>GPS</th><th>Ghi chú</th><th>User</th><th>Thời điểm</th>
          </tr>
        </thead>
        <tbody id="plantsBody"></tbody>
      </table>
      <div id="plantsPager" class="pager"></div>
    </div>
  </section>

  <!-- ── Chats ── -->
  <section id="tab-chats" class="tab-panel">
    <div class="panel table-wrap">
      <table>
        <thead>
          <tr><th>User</th><th>Phiên</th><th>Người gửi</th><th>Loại</th><th>Nội dung</th><th>Thời điểm</th></tr>
        </thead>
        <tbody id="chatsBody"></tbody>
      </table>
    </div>
  </section>
</main>

<!-- ── Modal chi tiết user ── -->
<div id="modal" class="modal hidden">
  <div class="modal-box">
    <button id="modalClose" class="modal-close">✕</button>
    <div id="modalContent"></div>
  </div>
</div>

<script src="app.js"></script>
</body>
</html>
