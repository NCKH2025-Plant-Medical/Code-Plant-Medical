name: thunghiem1
description: "A new Flutter project."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.8.1

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  image_picker: ^1.0.7
  camerawesome: ^2.5.0
  google_fonts: ^6.3.2
  flutter_launcher_icons: ^0.14.4
  flutter_native_splash: ^2.4.0
  intl: ^0.18.1
  image: ^4.1.3

flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/icon/icon.jpg"
  min_sdk_android: 21

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^5.0.0

flutter_native_splash:
  color: "#ffffff"
  image: assets/icon/icon.jpg
  android_12:
    color: "#ffffff"
    image: assets/icon/icon.jpg

flutter:
  assets:
    - assets/img/Banner.jpg
    - assets/img/

  uses-material-design: true

